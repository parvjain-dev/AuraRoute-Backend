{% extends "sqladmin/layout.html" %} {% block content %}
<div class="col-12">
  <div class="card">
    <div class="card-header">
      <h3 class="card-title">Data Ingestion Pipelines</h3>
    </div>
    <div class="card-body">
      <p>Run your data pipelines manually and monitor the output.</p>

      <div class="d-flex gap-3 mb-4">
        <form action="/admin/run-osm" method="POST">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-download"></i> Fetch Baseline OSM Restaurants
            (Bengaluru Test)
          </button>
        </form>
        <form action="/admin/run-llm" method="POST">
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Unique
            Stops (Bengaluru -> Gokarna)
          </button>
        </form>
      </div>

      {% if message %}
      <div class="alert alert-info">
        <strong>Pipeline Output:</strong><br />
        <pre style="margin-top: 10px; margin-bottom: 0">{{ message }}</pre>
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endblock %}
